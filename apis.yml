aid: voidpet
name: Voidpet
description: >-
  Voidpet is a creative games studio behind emotion-inspired games, stories,
  characters, and community — including Voidpet Dungeon, a turn-based roguelite
  RPG about befriending and battling emotion-inspired creatures, and Voidpet
  Garden, a mental-health companion game for collecting emotions and practicing
  self care. Beyond the games, Voidpet publishes a small, public, read-only
  Discovery API (OpenAPI 3.1) plus a hosted Model Context Protocol server and a
  packaged Agent Skill so agents can discover its public products, pages, and
  legal documents. The discovery surface exposes no accounts, game state, or
  authenticated actions — it is agent-facing metadata only.
