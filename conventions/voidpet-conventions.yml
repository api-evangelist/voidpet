summary: >-
  Cross-cutting semantics for the Voidpet Public Discovery API. It is a small,
  public, read-only JSON API with no authentication, no pagination, and no
  mutating operations, so most write-oriented conventions (idempotency, rate-limit
  signaling) do not apply.
